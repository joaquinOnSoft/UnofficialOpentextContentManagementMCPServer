    put:
      operationId: "Submitactionplans"
      summary: "Submit Action Plans"
      description: "Action plan submision for an event."
      consumes:
      - "application/x-www-form-urlencoded"
      produces:
      - "application/json"
      parameters:
      - name: "action_plan_items"
        description: |
          JSON string
          \
          Example: 
          ```
          [
            {
              "rules": [
                {
                  "from": "userId",
                  "operator": "Equal to",
                  "to": "jbaker",
                  "conjunction": "And"
                }, {
                  "from": "seqNumber",
                  "operator": "Equal to",
                  "to": "82096",
                  "conjunction": ""
                }
              ],
              "actions": [
                {
                  "action": "DocGenEventAction.Generate Document",
                  "DocGenEventAction.Generate Document_fields": {
                    "DocumentType": {
                      "source": "evtProp",
                      "evtProp_field": "seqNumber"
                    },
                    "UserId": {
                      "source": "prevAct",
                      "prevAct_field": "Result from previous action"
                    }
                  }
                }, {
                  "action": "DocGenEventAction.Generate Document",
                  "DocGenEventAction.Generate Document_fields": {
                    "DocumentType": {
                      "source": "evtProp",
                      "evtProp_field": "seqNumber"
                    },
                    "UserId": {
                      "source": "prevAct",
                      "prevAct_field": "Result from previous action"
                    }
                  }
                }
              ],
              "summary": {
                "run_as": 47276,
                "process_mode": "Synchronously"
              },
              "gen_information": {
                "event_id": "com.successfactors.Employment.JobInformation.LocationChange",
                "namespace": "SucessFactors",
                "event_name": "Change in Employee Location"
              }
            }
          ]
          ```
          here ***"rules"*** is optional, ***"run_as"*** is the userid
        type: "string"
        required: true
        in: "formData"
      responses:
        "200":
          description: "ok"
          schema:
            $ref: "#/definitions/eac_Submitactionplans"
        "500":
          description: ""
      tags:
      - "eventactioncenter"
