    put:
      operationId: "UpdateUniqueName"
      summary: "Update unique name definition"
      description:
        Updates a new unique name definition.
      consumes:
      - "application/x-www-form-urlencoded"
      produces:
      - "application/json"
      parameters:
      - name: "unique_name"
        description:
          The name of the unique name definition to be updated
        type: "string"
        required: true
        in: "formData"
      - name: "new_unique_name"
        description:
          The new name of the unique name definition if rename is wanted
        type: "string"
        required: false
        in: "formData"
      - name: "unique_name_group"
        description:
          The name of the group where to be updated
        type: "string"
        required: false
        in: "formData"
      - name: "path"
        description: |
          A list of strings to specify the CS path of the unique name target
          \
          Example: ***path={Enterprise, Procurement, Vendors}***
        type: "string"
        required: false
        in: "formData"
      - name: "node_name"
        description: |
          The name of the CS node representing the unique name target
          \
          Example: ***node_name=Atlanta Electronics Supply***
        type: "string"
        required: false
        in: "formData"
      responses:
        "200":
          description: "ok"
          schema:
            $ref: "#/definitions/update_uniquename_result"
        "401":
          description: "Authentication is required"
        "500":
          description: "Server failed to process the request"
      tags:
      - "uniquenames"
    delete:
      operationId: "DeleteUniqueName"
      summary: "Delete unique name definition"
      description:
        Delete a new unique name definition.
      produces:
      - "application/json"
      parameters:
      - name: "unique_name"
        description:
          The name of the unique name definition to be deleted
        type: "string"
        required: true
        in: "query"
      responses:
        "200":
          description: "ok"
          schema:
            $ref: "#/definitions/delete_uniquename_result"
        "401":
          description: "Authentication is required"
        "500":
          description: "Server failed to process the request"
      tags:
      - "uniquenames"
