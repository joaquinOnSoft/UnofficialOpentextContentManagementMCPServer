    post:
      operationId: "SaveExpressionData"
      summary: "Saves Expression Builder Data."
      description: |
        Executes the REST API action to validate and saves Expression
        Builder Data in cache.
        
        Examples for ExpressionData 
        
        **Example with one expression:** ("intfld = 100")
        
        ```
        key: 26605;0;78038;3992;None
        subtype: 5
        type: 1
        Type1: (
        Type2: 13515
        Operand2: 5
        Operator2: =
        Value2: 100
        Type3: )
        nRows: 3
        ```

        **Example with two expressions:** ("intfld = 100") AND ("textfld = Hi")

        ```
        key: 26605;1243670608;78038;3992;None
        subtype: 5
        type: 1
        Type1: (
        Type2: 13515
        Operand2: 5
        Operator2: =
        Value2: 100
        Type3: )
        Type4: (
        Conjunct4: AND
        Type5: 13515
        Operand5: 7
        Operator5: =
        Value5: Hi
        Type6: )
        nRows: 6
        ```

        **Example with three expression:** ("intfld = 100") AND ("textfld = Hi") OR ("flag = True")

        ```
        key: 26605;1243670608;78038;3992;None
        subtype: 5
        type: 1
        Type1: (
        Type2: 13515
        Operand2: 5
        Operator2: =
        Value2: 100
        Type3: )
        Type4: (
        Conjunct4: AND
        Type5: 13515
        Operand5: 7
        Operator5: =
        Value5: Hi
        Type6: )
        Type7: (
        Conjunct7: OR
        Type8: 13515
        Operand8: 4
        Operator8: =
        Value8: 1
        Type9: )
        nRows: 9
        ```

        To validate ExpressionData, check wheather the "expressionText" in response is reproduced correctly.

        To save ExpressionData in database, use ["Saves smart document type bot"](#operations-smartdocumenttypes-SaveSmartDocumentTypeBot) API to save "context" bot by passing "expressionData", "expressionDataKey" and "expressionText" from response body. Please refer to the ***Saves smart document type bot*** API for more details.

        Note: Since swagger 2.0 only supports fixed key names in form data, we are providing support for up to three statements only.
