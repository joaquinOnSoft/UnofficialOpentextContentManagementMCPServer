  /v2/smartdocumenttypes/rules:
    post:
      operationId: "CreateSmartDocumentTypeRule"
      summary: "Creates smart documemt type rule."
      description: >-
        Executes the REST API action and creates smart documemt type rule. <br>
        <br>
        **Note:** <br> 
        **Please make sure to send dynamic permissions related fields only when dynamic permissions 
        are enabled on the workspace template.**
      consumes:
      - "application/x-www-form-urlencoded"
      produces:
      - "application/json"
      parameters:
      - name: "smart_document_type_id"
        description: "Node ID of the smart document type"
        type: "integer"
        required: true
        in: "formData"
      - name: "classification_id"
        description: 
          "Classification Node ID to be associated with the smart document type node"
        type: "integer"
        required: true
        in: "formData"
      - name: "template_id"
        description: 
          "Template Node ID to be associated with the smart document type node"
        type: "integer"
        required: true
        in: "formData"
      - name: "mandatory"
        description: "Mandatory Flag"
        type: "boolean"
        required: false
        in: "formData"
      - name: "validity_required"
        description: "Validity Flag"
        type: "boolean"
        required: false
        in: "formData"
      - name: "validity_years"
        description: "Number of years the document is valid"
        type: "integer"
        required: false
        in: "formData"
      - name: "validity_months"
        description: "Number of months the document is valid"
        type: "integer"
        required: false
        in: "formData"
      - name: "based_on_category"
        description: "Category Node ID"
        type: "integer"
        required: false
        in: "formData"
      - name: "based_on_attribute"
        description: "Attribute ID"
        type: "integer"
        required: false
        in: "formData"
      - name: "location"
        description: "Location ID of the folder in format i.e. 'id'"
        type: "string"
        required: false
        in: "formData"
      - name: "upload_member_list"
        description: >-
          list of member IDs (user/group/role IDs attached to the workspace template) who are allowed to upload 
          the documents from workspace i.e.'ID1, ID2...'
        type: "string"
        required: false
        in: "formData"
      - name: "upload_dynperm_list"
        description: >-
          list of dynamic permission role IDs (attached to the workspace template) who are allowed to upload 
          the documents i.e.'ID1, ID2...'
        type: "string"
        required: false
        in: "formData"
      - name: "delete_member_list"
        description: >-
          list of member IDs (user/group/role IDs attached to the workspace template) who are allowed to delete
          the documents from workspace i.e.'ID1, ID2...'
        type: "string"
        required: false
        in: "formData"
      - name: "delete_dynperm_list"
        description: >-
          list of dynamic permission role IDs (attached to the workspace template) who are allowed to delete
          the documents i.e.'ID1, ID2...'
        type: "string"
        required: false
        in: "formData"
      - name: "docgen"
        description: "Docgen Flag"
        type: "boolean"
        required: false
        in: "formData"
      - name: "upload_review_required"
        description: "Flag to enable approval workflow for uploads"
        type: "boolean"
        required: false
        in: "formData"
      - name: "upload_review_workflow_map_id"
        description: "Upload with approval bot workflow map ID"
        type: "integer"
        required: false
        in: "formData"
      - name: "upload_review_member"
        description: >-
          Mapping of workflow map and workspace user ID i.e.{ 'workflow map', workspace user ID } <br>
          <br> 
          **Note:** <br>
          **Since swagger only supports fixed key names in form data, we are providing support for only one mapping.
          You can use other REST API clients to add multiple mappings and create smart document type rule.**
        type: "string"
        required: false
        in: "formData"
      - name: "upload_review_dynperm"
        description: >-
          Mapping of workflow role name with workspace dynamic permission role ID i.e.
          {'workflow role', dynamic permission role ID} so that all the participants of 
          these dynamic permission roles are allowed to review if the documents are uploaded 
          to the workspace <br><br> 
          **Note:** <br>
          **Since swagger only supports fixed key names in form data, we are providing support
          for only one mapping. You can use other REST API clients to add multiple mappings and
          create smart document type rule**
        type: "string"
        required: false
        in: "formData"
      - name: "delete_review_required"
        description: "Flag to enable approval workflow for deletion"
        type: "boolean"
        required: false
        in: "formData"
      - name: "delete_review_workflow_map_id"
        description: "Delete with approval bot workflow map ID"
        type: "integer"
        required: false
        in: "formData"
      - name: "delete_review_member"
        description: >-
          Mapping of workflow map and workspace user ID i.e.{ 'workflow map', workspace user ID } <br>
          <br>
          **Note:** <br>
          **Since swagger only supports fixed key names in form data, we are providing support
          for only one mapping. You can use other REST API clients to add multiple mappings and
          create smart document type rule**
        type: "string"
        required: false
        in: "formData"
      - name: "delete_review_dynperm"
        description: >-
          Mapping of workflow role name with workspace dynamic permission role ID i.e.
          {'workflow role', dynamic permission role ID} so that all the participants of
          these dynamic permission roles are allowed to review if the documents are deleted 
          from the workspace <br><br>
          **Note:** <br>
          **Since swagger only supports fixed key names in form data, we are providing support
          for only one mapping. You can use other REST API clients to add multiple mappings and 
          create smart document type rule**
        type: "string"
        required: false
        in: "formData"


      responses:
        "200":
          description: "ok"
          schema:
            $ref: "#/definitions/DefCreateSmartDocumentTypeRule"
        "400":
          description: "Invalid data specified"
        "401":
          description: "Authentication is required"
        "500":
          description: "Server failed to process the request."
      tags:
      - "smartdocumenttypes"
