  /v2/uniquenames:
    get:
      operationId: "GetUniqueNames"
      summary: "Get unique name definitions"
      description:
        Performs a query for unique name definitions. As search filter
        the name of the unique name definition, the subtype and the application
        type of the object that the unique name definition refers to can be used.
        Either a single value can be provided for these parameters or a list of
        values. A list is specified as comma separated list of values surrunded
        by braces like *{name1, name2}* or *{0,144}*. The search parameters
        are combined to a logical OR condition.
      produces:
      - "application/json"
      parameters:
      - name: "where_names"
        description: |
          A name or a list of names of the wanted unique name definitions
          \
          Examples:
          search for a single name: ***where_names=Presentations***
          search for a single name with two words: ***where_names=Text Templates***
          search for a list of names: ***where_names={Presentations, Text Templates}***
        type: "string"
        required: false
        in: "query"
      - name: "where_subtype"
        description:
          A subtype or a list of subtypes of the objects referred to by
          the wanted unique name definitions
        type: "string"
        required: false
        in: "query"
      - name: "where_appltype"
        description: "Appltype of the object referred to by the unique name definition"
        type: "integer"
        required: false
        in: "query"
      responses:
        "200":
          description: "ok"
          schema:
            $ref: "#/definitions/get_uniquenames_result"
        "401":
          description: "Authentication is required"
        "500":
          description: "Server failed to process the request"
      tags:
      - "uniquenames"
    post:
      operationId: "CreateUniqueName"
      summary: "Create unique name definition"
      description:
        Creates a new unique name definition.
      consumes:
      - "application/x-www-form-urlencoded"
      produces:
      - "application/json"
      parameters:
      - name: "unique_name"
        description:
          The name of the unique name definition to be created
        type: "string"
        required: true
        in: "formData"
      - name: "unique_name_group"
        description:
          The name of the group where to create the unique name definition
        type: "string"
        required: true
        in: "formData"
      - name: "path"
        description: |
          A list of strings to specify the CS path of the unique name target
          \
          Example: ***path={Enterprise, Procurement, Vendors}***
        type: "string"
        required: true
        in: "formData"
      - name: "node_name"
        description: |
          The name of the CS node representing the unique name target
          \
          Example: ***node_name=Atlanta Electronics Supply***
