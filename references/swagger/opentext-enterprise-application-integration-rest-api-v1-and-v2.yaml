  /v2/smartdocumenttypes/rules/{rule_id}/bots/{bot_key}:
    put:
      operationId: "SaveSmartDocumentTypeBot"
      summary: "Saves smart document type bot."
      description: "Executes the REST API action and save smart document type bot."
      produces:
      - "application/json"
      consumes:
      - "application/x-www-form-urlencoded"
      parameters:
      - name: "rule_id"
        description: "Rule ID of document type"
        type: "integer"
        required: true
        in: "path"
      - name: "bot_key"
        description: 
          Name of the Bot to be saved i.e. uploadcontrol, deletecontrol, createdocument,
          context, completenesscheck, uploadwithapproval, deletewithapproval
        type: "string"
        required: true
        in: "path"
      - name: "body"
        description: |
          Here are the examples of body content for each bot:
          \
          **Allow Upload bot:**
          ```
          {
            "member"      : [2001],
            "bot_action"  : "add",
            "membersData" : [{"id":2001,"name":"Business Administrators"}]
          }
          ```
          **To add multiple members:**
          ```
          {
            "member"      : [2001,58787],
            "bot_action"  : "add",
            "membersData" : [ 
              {"id":2001 ,"name":"Business Administrators"},
              {"id":58787,"name":"testuser1"} 
            ]
          }
          ```
          **Completeness check bot:**
          ```
          {
            "mandatory"          : false,
            "based_on_category"  : "5675",
            "based_on_attribute" : "",
            "validity_required"  : false,
            "validity_years"     : null,
            "validity_months"    : "0",
            "bot_action"         : "add"
          }
