---
swagger: "2.0"
info:
  title: "OpenText Enterprise Application Integration REST API"
  description: |
   OpenText Enterprise Application Integration REST API (v1 and v2 calls) <br>
   Slashes and backslashes within external system names, business object type names, and business object IDs 
   have to be passed as UTF-16 characters 0xF0A6 (backslash) and 0xF0A7 (slash).
   In your REST Url you have to UTF-8 encode them as %EF%82%A6 (backslash) and %EF%82%A7 (slash).
  version: "v1 and v2"
host: "content_server_url"
schemes:
- "http"
- "https"
securityDefinitions:
  basicAuth:
    type: "basic"
  ApiKeyAuth:
    type: "apiKey"
    in: header
    name: OTCSTicket
    description: "Requests need to be authenticated. You can get an OTCS ticket by posting your credentials to /auth."
security:
- basicAuth: []
- ApiKeyAuth: []
basePath: "/api"
tags:
- name: "auth"
  description: "Authenticate user"
- name: "businessobjects"
  description: "Manage Business Attachments for Business Object"
- name: "businessobjecttypes"
  description: "Get business object type"
- name: "businessworkspaces"
  description: "Manage Business Workspaces"
- name: "externalsystems"
  description: "Get external system info"
- name: "forms"
  description: "Get forms for object creation and search"
- name: "nodes"
  description: "Manage nodes"
- name: "eventactioncenter"
  description: "Executes action plans based on event types"
- name: "licenses"
  description: "Manage licensing and audit information"
- name: "permissions"
  description: "Gets or sets the permissions of the specified node."
- name: "uniquenames"
  description: "Manage unique name definitions."
- name: "webviewer"
  description: "Get WebViewer configuration informaton."
- name: "transports"
  description: "Import Transports."
- name: "aib"
  description: "Appworks Integration Bridge."
- name: "smartdocumenttypes"
  description: "Smart Document Types."
- name: "expressionbuilder"
  description: "Expression builder."
- name: "fileupload"
  description: "File Upload."
- name:  "Workflow"
  description: "Delete Document."
- name: scheduledBots
  description: "Scheduled Bots"
paths:
  /v1/auth:
    post:
      operationId: "authenticate"
      summary: "Authenticate user"
      description: 
        Authenticates user with the given credentials, returning an OTCS ticket if authorized.
      consumes:
      - "application/x-www-form-urlencoded"
      produces:
      - "application/json"
      parameters:
      - name: "username"
        description: "Login name"
        type: "string"
        required: true
        in: "formData"
      - name: "password"
        description: "Login password"
        type: "string"
        required: true
        in: "formData"
      - name: "domain"
        description: "Login domain"
        type: "string"
        required: false
        in: "formData"
      responses:
        "200":
          description: "ok"
          schema:
            $ref: "#/definitions/AuthenticationInfo"
        "400":
          description: "Invalid parameter value"
        "401":
          description: "Invalid username/password specified"
      tags:
      - "auth"
  /v2/businessobjects:
    get:
      operationId: "getBusinessObjects"
      summary: "Get business objects"
      description: 
        Gets the business objects from an external system. Either you have to provide the *bo_type_id* or the combination of *ext_system_id* and *bo_type*.
      produces:
      - "application/json"
      parameters:
      - name: "ext_system_id"
        description: "External system ID"
        type: "string"
        required: false
        in: "query"
      - name: "bo_type"
        description: "Business object type"
        type: "string"
        required: false
        in: "query"
      - name: "bo_type_id"
        description: "Business object type ID"
        type: "integer"
        required: false
        in: "query"
      - name: "page"
        description: "Page"
        type: "integer"
        required: false
        in: "query"
      - name: "limit"
        description: "Limit"
        type: "integer"
        required: false
        in: "query"
      - name: "where_ANLNR"
        description: "Field to be searched (just an example)"
        type: "string"
        required: false
        in: "query"
      responses:
        "200":
          description: "ok"
          schema:
            $ref: "#/definitions/SearchResult"
        "401":
          description: "Authentication is required"
        "500":
          description: "Cannot get a search result. Server failed to process the request."
      tags:
      - "businessobjects"
  /v2/businessobjects/{ext_system_id}/{bo_type}/businessattachments:
    put:
      operationId: "UpdateBusinessAttachments"
      summary: "Update Business Attachments"
      description: "Updates category attributes of all business attachments for the specified business objects."
      consumes:
      - "application/x-www-form-urlencoded"
      produces:
      - "application/json"
      parameters:
      - name: "ext_system_id"
        description: "The external system ID"
        type: "string"
        required: true
        in: "path"
      - name: "bo_type"
        description: "The business object type"
        type: "string"
        required: true
        in: "path"
      - name: "body"
        description: |
          JSON string
          \
          Example: 
          ```
          {
            "boIDs": ["1900001","1900002","1900003" ]
          }
          ```
        type: "string"
        required: true
        in: "formData"
      responses:
        "200":
          description: "ok"
          schema:
            $ref: "#/definitions/busobjs_UpdateBusinessAttachments"
        "500":
          description: "Could not get the attachments for {bo_type}"
      tags:
      - "businessobjects"
  /v2/businessobjects/{ext_system_id}/{bo_type}/{bo_id}/businessattachments:
    get:
      operationId: "GetBusinessAttachments"
      summary: "Get Business Attachments"
      description: "Gets the business attachments for the specified business object."
      produces:
      - "application/json"
      parameters:
      - name: "ext_system_id"
        description: "The external system ID"
        type: "string"
        required: true
        in: "path"
      - name: "bo_type"
        description: "The business object type"
        type: "string"
        required: true
        in: "path"
      - name: "bo_id"
        description: "The business object ID"
        type: "string"
        required: true
        in: "path"
      - name: "where_name"
        description: "Filter for name, e.g. like_%Customer%"
        type: "string"
        required: false
        in: "query"
      - name: "sort"
        description: "Sort, e.g. asc_name or desc_name or name or modified date"
        type: "string"
        required: false
        in: "query"
      - name: "page"
        description: "Paging, e.g. 5, limit must also be provided"
        type: "integer"
        required: false
        in: "query"
      - name: "limit"
        description: "Paging, e.g. 5, page must also be provided"
        type: "integer"
        required: false
        in: "query"
      - name: "expand"
        description: |
          Expand, e.g. *properties{parent_id, reserved_user_id, ancestors, ...}*<br>
          parent_id - parent node info 
          reserved_user_id - reserved user info 
          ancestors - ancestors info
        type: "string"
        required: false
        in: "query"
      responses:
        "200":
          description: "ok"
          schema:
            $ref: "#/definitions/busobjs_GetBusinessAttachments"
        "500":
          description: "Could not get the attachments for {bo_id}"
      tags:
      - "businessobjects"
  /v2/businessobjects/{ext_system_id}/{bo_type}/{bo_id}/businessattachments/{node_id}:
    post:
      operationId: "AddBusinessAttachments"
      summary: "Add Business Attachments"
      description: "Adds the business attachments for the specified business object."
      consumes:
      - "application/x-www-form-urlencoded"
      produces:
      - "application/json"
      parameters:
      - name: "ext_system_id"
        description: "The external system ID"
        type: "string"
        required: true
        in: "path"
      - name: "bo_type"
        description: "The business object type"
        type: "string"
        required: true
        in: "path"
      - name: "bo_id"
        description: "The business object ID"
        type: "string"
        required: true
        in: "path"
      - name: "node_id"
        description: "The content server object ID/node ID"
        type: "integer"
        required: true
        in: "path"
      - name: "comment"
        description: "comment"
        type: "string"
        required: false
        in: "formData"
      - name: "expand"
        description: |
          Expand, e.g. *properties{parent_id, reserved_user_id, ancestors, ...}*<br>
          parent_id - parent node info 
          reserved_user_id - reserved user info 
          ancestors - ancestors info
        type: "string"
        required: false
        in: "formData"
      responses:
        "200":
          description: "ok"
          schema:
            $ref: "#/definitions/busobjs_AddBusinessAttachments"
        "400":
          description: "Action is invalid for this object type"
        "401":
          description: "Authentication is required"
        "500":
          description: >-
            Cannot insert link. 
            id_bo_type = {id_bo_type}, sapObjectKey = {bo_id}, nodeID = {node_id}, comment = ad, 
            error = Cannot add business attachment because duplicate records were found
      tags:
      - "businessobjects"
  /v2/businessobjecttypes:
    get:
      operationId: "getBusinessObjectTypes"
      summary: "Search for business object types"
      description: "Gets the business object types from an external system."
      produces:
      - "application/json"
      parameters:
      - name: "where_is_default_search"
        description: "Filter for the 'Is default search enabled' setting"
        type: "boolean"
        required: false
        in: "query"
      responses:
        "401":
          description: "Authentication is required."
        "500":
          description: "Cannot get a search result. Server failed to process the request."
      tags:
      - "businessobjecttypes"
    post:
      operationId: "CreateBusinessObjectType"
      summary: "creates a new business object type"
      description: "creates a new business object type"
      consumes:
      - "multipart/form-data"
      produces:
      - "application/json"
      parameters:
      - name: ID_EXTSYSTEM
        description: "ID of the external busines application"
        type: "string"
        required: true
        in: "formData"
      - name: BO_TYPE_NAME
        description: "Name of the business object type to be created"
        type: "string"
        required: true
        in: "formData"
      - name: BUSINESS_OBJECT_TYPE
        description: "Business object type from the external sytem"
        type: "string"
        required: true
        in: "formData"
      - name: SimplifyBusinessWorkspaceCreation
        description: "Skip metadata dialog"
        type: "boolean"
        required: false
        in: "formData"
      - name: USE_FOR_BUSWKSP
        description: "Used for creation of business workspaces"
        type: "boolean"
        required: false
        in: "formData"       
      - name: ID_REFERENCE_TYPE
        description: "ID for the workspace type to be used"
        type: "integer"
        required: false
        in: "formData"     
      - name: IS_DEFAULT_SEARCH
        description: >-
          This Business Object Type is displayed if more than one Business Object Type
          is used in just one Business Workspace Type.
        type: "boolean"
        required: false
        in: "formData"
      - name: IS_DEFAULT_DISPLAY
        description: >-
          This Business Object Type is displayed if more than one Business Object Type
          is used in just one Business Workspace Type.
        type: "boolean"
        required: false
        in: "formData"
      - name: DISPLAY_URL
        description: >-
          The display URL is used in OpenText Content Management to open business object data
          from the business application in a browser window.
        type: "string"
        required: false
        in: "formData"
      - name: USE_FOR_BUSREF
        description: "Used as business attachment"
        type: "boolean"
        required: false
        in: "formData"
      - name: BUSREF_NAME
        description: "Business Object Name Pattern"
        type: "string"
        required: false
        in: "formData"
      - name: ENABLE_AUTO_ADD_BO
        description: >-
          If enabled this business object type will be added as Business Object
          based on the trigger category and attribute
        type: "boolean"
        required: false
        in: "formData"
      - name: TRIGGER_CAT
        description: >-
          Trigger Automatic Creation based on the provided category and attribute. 
          It can be reset by passing -1 as input. It must always be used along with TRIGGER_ATTR.
        type: "integer"
        required: false
        in: "formData"
      - name: TRIGGER_ATTR
        description: >-
          Trigger Automatic Creation based on the provided category and attribute.
          It can be reset by passing -1 as input. It must always be used along with TRIGGER_CAT.
        type: "integer"
        required: false
        in: "formData"
      - name: BADI_BEFORE_ADD
        description: "Enable Callback Interface Before Adding Business Objects"
        type: "boolean"
        required: false
        in: "formData"
      - name: BADI_BEFORE_DEL
        description: "Enable Callback Interface Before Removing Business Objects"
        type: "boolean"
        required: false
        in: "formData"
      - name: META_DATA_MAPPING
        description: "Enable Metadata Mapping from the business application to OpenText Content Server"
        type: "boolean"
        required: false
        in: "formData"
      - name: AUTO_KEYDEF
        description: |
          JSON string
          
          Example: 
          ```
          {"EQUIPMENT":[3842,21]}
          ```
        type: "string"
        required: false
        in: "formData"
      - name: propertyMappings
        description: |
          JSON string
          
          Example: 
          ```
          [
            {
              "bo_prop_name": " test1",
              "cat_cb_name": "CategoryAttribute",
              "cat_cb_parm": " 3831",
              "set_name": "",
              "att_name": "Equipment"
            },
            {
              "bo_prop_name": "test2",
              "cat_cb_name": "CategoryAttribute",
              "cat_cb_parm": "3831",
              "set_name": "",
              "att_name": " Description"
            } 
          ]
          ```
        type: "string"
        required: false
        in: "formData"
      - name: propertyGroups
        description: |
          JSON string
          
          Example: 
          ```
          [
            {
              "bo_prop_group_name": "Test",
              "cat_cb_name": "CategorySet",
              "cat_cb_parm": "3831",
              "mappings": [
                {
                  "att_name": "Type",
                  "bo_prop_name": "GAART"
                }   
              ],
              "set_name":"General"
            },
            {
              "bo_prop_group_name": "Test3",
              "cat_cb_name": "CategorySet",
              "cat_cb_parm": "3831",
              "mappings": [   
                {
                  "att_name": "Location",
                  "bo_prop_name": "GAART"
                },
                {
                  "att_name": "Location ID",
                  "bo_prop_name": "GAART"
                }
              ],
              "set_name":"Location"
            }
          ]
          ```
        type: "string"
        required: false
        in: "formData"
      - name: multilinguals
        description: |
          JSON string
          
          Example: 
          ```
          {"en":"Material"}
          ```
        type: "string"
        required: false
        in: "formData"
      - name: boCallBacks
        description: |
          JSON string
          
          This is used for workspace template select and BARCODE. Both None and null can be used to reset the fields.
          
          Example: 
          ```
          [
            {
              "cb_usage": "TEMPLATE",
              "cb_name": "StaticNodeId",
              "cb_parm":"5499"
            },
            {
              "cb_usage": "BARCODE",
              "cb_name": "MultiValued",
              "cbMultiValues":["33597:2","14571:3"]
            } 
          ]
          ```
        type: "string"
        required: false
        in: "formData"
      - name: documentTypes
        description: |
          JSON string
          
          Example: 
          ```
          [
            {
              "DOC_TYPE": "CMIS",
              "ID_DECLARATION_TYPE": "1"
            } 
          ]
          ```
        type: "string"
        required: false
        in: "formData"
      - name: crossAppRelations
        description: |
          JSON string
          
          Example: 
          ```
          [
            {
              "businessObjectType": "BUS1505",
              "extSystem": "Sample",
              "property": "OBJTYPE"
            },
            {
              "businessObjectType": "BUS1505",
              "extSystem": "Sample",
              "property": "OBJTYPE"
            }
          ]
          ```
        type: "string"
        required: false
        in: "formData"
      - name: serviceURL
        description: "service URL for S4HANA connection type" 
        type: "string"
        required: false
        in: "formData"
      - name: oDataAPI
        description: "oDataAPI for S4HANA connection type" 
        type: "string"
        required: false
        in: "formData"
      - name: collection
        description: "collection for S4HANA connection type" 
        type: "string"
        required: false
        in: "formData"
      - name: events
        description: |
          JSON string
          
          Example: 
          ```
          ["Created","Changed"]
          ``` 
        type: "string"
        required: false
        in: "formData"
      - name: selected
        description: |
          Selected filter attributes (JSON string)
          
          Example: 
          ```
          ["ContractAccount","CreationDate"]
          ``` 
        type: "string"
        required: false
        in: "formData"
      - name: boRelations
        description: |
          JSON string
          
          Example: 
          ```
          [
            {
              "nav_bo_type":"BUS_APP_ID",
              "related_BO_type": "Equipment2",
              "relationType": "parent"
            },
            {
              "nav_bo_type": "Test",
              "related_BO_type": "Product",
              "relationType": "compositeParent"
            },
            {
              "nav_bo_type": "BUS_APP_ID_Name",
              "related_BO_type": "Product3",
              "relationType": "child"
            }
          ]
          ``` 
        type: "string"
        required: false
        in: "formData"
      responses:
        "200":
          description: "ok"
          schema:
            $ref: "#/definitions/boType_createUpdateBoType"
        "401":
          description: "Authentication is required."
        "500":
          description: "Failed to process the request."
      tags:
      - "businessobjecttypes"
    put:
      operationId: "UpdateBusinessObjectType"
      summary: "Updates an existing business object type"
      description: "Updates an existing business object type"
      consumes:
      - "multipart/form-data"
      produces:
      - "application/json"
      parameters:
      - name: ID_BO_TYPE
        description: "ID of the business object type"
        type: "integer"
        required: true
        in: "formData"
      - name: ID_EXTSYSTEM
        description: "ID of the external busines application"
        type: "string"
        required: false
        in: "formData"
      - name: BO_TYPE_NAME
        description: "Name of the business object type to be created"
        type: "string"
        required: false
        in: "formData"
      - name: BUSINESS_OBJECT_TYPE
        description: "Business object type from the external sytem"
        type: "string"
        required: false
        in: "formData"
      - name: SimplifyBusinessWorkspaceCreation
        description: "Skip metadata dialog"
        type: "boolean"
        required: false
        in: "formData"
      - name: USE_FOR_BUSWKSP
        description: "To enable the business object for workspace creation"
        type: "boolean"
        required: false
        in: "formData"       
      - name: ID_REFERENCE_TYPE
        description: "ID for the workspace type to be used"
        type: "integer"
        required: false
        in: "formData"     
      - name: IS_DEFAULT_SEARCH
        description: >-
          This Business Object Type is displayed if more than one Business Object Type
          is used in just one Business Workspace Type.
        type: "boolean"
        required: false
        in: "formData"
      - name: IS_DEFAULT_DISPLAY
        description: >-
          This Business Object Type is displayed if more than one Business Object Type
          is used in just one Business Workspace Type.
        type: "boolean"
        required: false
        in: "formData"
      - name: DISPLAY_URL
        description: >-
          The display URL is used in OpenText Content Management to open business object data
          from the business application in a browser window.
        type: "string"
        required: false
        in: "formData"
      - name: USE_FOR_BUSREF
        description: "To enable the option to add as business attachtments"
        type: "boolean"
        required: false
        in: "formData"
      - name: BO_TYPE_DELETED
        description: >-
          If set to true the business object type will be disabled. 
          This field must be updated as a standalone field.
        type: "boolean"
        required: false
        in: "formData" 
      - name: BUSREF_NAME
        description: "Business Object Name Pattern"
        type: "string"
        required: false
        in: "formData"        
      - name: ENABLE_AUTO_ADD_BO
        description: >-
          If enabled this business object type will be be added as Business Object
          based on the trigger category and attribute
        type: "boolean"
        required: false
        in: "formData"
      - name: TRIGGER_CAT
        description: >-
          Trigger Automatic Creation based on the provided category and attribute. 
          It can be reset by passing -1 as input. It must always be used along with TRIGGER_ATTR.
        type: "integer"
        required: false
        in: "formData"
      - name: TRIGGER_ATTR
        description: >-
            Trigger Automatic Creation based on the provided category and attribute.
            It can be reset by passing -1 as input. It must always be used along with TRIGGER_CAT.
        type: "integer"
        required: false
        in: "formData"
      - name: BADI_BEFORE_ADD
        description: "Enable Callback Interface Before Adding Business Objects"
        type: "boolean"
        required: false
        in: "formData"
      - name: BADI_BEFORE_DEL
        description: "Enable Callback Interface Before Removing Business Objects"
        type: "boolean"
        required: false
        in: "formData"
      - name: META_DATA_MAPPING
        description: "Enable Metadata Mapping from the business application to OpenText Content Server"
        type: "boolean"
        required: false
        in: "formData"
      - name: MANAGED_OBJECT_TYPES
        description: |
          JSON string
          
          Example: 
          ```
          [144,848]
          ```
        type: "string"
        required: false
        in: "formData"
      - name: AUTO_KEYDEF
        description: |
          JSON string
          
          Example: 
          ```
          {"EQUIPMENT":[3842,21]}
          
          ```
        type: "string"
        required: false
        in: "formData"
      - name: propertyMappings
        description: |
          JSON string
          
          Example: 
          ```
          [
            {
              "bo_prop_name": " test",
              "cat_cb_name": "CategoryAttribute",
              "cat_cb_parm": " 3831",
              "set_name": "",
              "att_name": "Equipment"
            },
            {
              "bo_prop_name": "test2",
              "cat_cb_name": "CategoryAttribute",
              "cat_cb_parm": "3831",
              "set_name": "",
              "att_name": " Description"
            } 
          ]
          ```
        type: "string"
        required: false
        in: "formData"
      - name: propertyGroups
        description: |
          JSON string
          
          Example: 
          ```
          [
            {
              "bo_prop_group_name": "Test",
              "cat_cb_name": "CategorySet",
              "cat_cb_parm": "3831",
              "mappings": [
                {
                  "att_name": "Type",
                  "bo_prop_name": "GAART"
                }   
              ],
              "set_name":"General"
            },
            {
              "bo_prop_group_name": "Test3",
              "cat_cb_name": "CategorySet",
              "cat_cb_parm": "3831",
              "mappings": [   
                {
                  "att_name": "Location",
                  "bo_prop_name": "GAART"
                },
                {
                  "att_name": "Location ID",
                  "bo_prop_name": "GAART"
                }
              ],
              "set_name":"Location"
            }
          ]
          ```
        type: "string"
        required: false
        in: "formData"
      - name: multilinguals
        description: |
          JSON string
          
          Example: 
          ```
          {"en":"Material"}
          ```
        type: "string"
        required: false
        in: "formData"
      - name: boCallBacks
        description: |
          JSON string
          
          This is used for workplace template select and BARCODE. Both None and null can be used to reset the fields.
          
          Example: 
          ```
          [
            {
              "cb_usage": "TEMPLATE",
              "cb_name": "StaticNodeId",
              "cb_parm":"5499"
            },
            {
              "cb_usage": "BARCODE",
              "cb_name": "MultiValued",
              "cbMultiValues":["33597:2","14571:3"]
            } 
          ]
          ```
        type: "string"
        required: false
        in: "formData"
      - name: documentTypes
        description: |
          JSON string
          
          Example: 
          ```
