              "DOC_TYPE": "CMIS",
              "ID_DECLARATION_TYPE": "1",
              "IS_BUSINESS_ATTACHMENT":"0"
            } 
          ]
          ```
        type: "string"
        required: false
        in: "formData"
      - name: crossAppRelations
        description: |
          JSON string
          
          Example: 
          ```
          [
            {
              "businessObjectType": "BUS1505",
              "extSystem": "Sample",
              "property": "OBJTYPE"
            },
            {
              "businessObjectType": "BUS1505",
              "extSystem": "Sample",
              "property": "OBJTYPE"
            }
          ]
          ```
        type: "string"
        required: false
        in: "formData"
      - name: serviceURL
        description: "service URL for S4HANA connection type" 
        type: "string"
        required: false
        in: "formData"
      - name: oDataAPI
        description: "oDataAPI for S4HANA connection type" 
        type: "string"
        required: false
        in: "formData"
      - name: collection
        description: "collection for S4HANA connection type" 
        type: "string"
        required: false
        in: "formData"
      - name: events
        description: |
          JSON string
          \
          Example: 
          ```
          ["Created","Changed"]
          ``` 
        type: "string"
        required: false
        in: "formData"
      - name: selected
        description: |
          Selected filter attributes (JSON string)
          
          Example: 
          ```
          ["ContractAccount","CreationDate"]
          ``` 
        type: "string"
        required: false
        in: "formData"
      - name: boRelations
        description: |
          JSON string
          
          Example: 
          ```
          [
            {
              "nav_bo_type":"BUS_APP_ID",
              "related_BO_type": "Equipment2",
              "relationType": "parent"
            },
            {
              "nav_bo_type": "Test",
              "related_BO_type": "Product",
              "relationType": "compositeParent"
            },
            {
              "nav_bo_type": "BUS_APP_ID_Name",
              "related_BO_type": "Product3",
              "relationType": "child"
            }
          ]
          ``` 
        type: "string"
        required: false
        in: "formData"
      responses:
        "200":
          description: "ok"
          schema:
            $ref: "#/definitions/boType_createUpdateBoType"
        "401":
          description: "Authentication is required."
        "500":
          description: "Unable to update the business object type .Server failed to process the request."
      tags:
      - "businessobjecttypes" 
