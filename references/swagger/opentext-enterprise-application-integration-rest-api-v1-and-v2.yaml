  /v2/nodes/{node_id}/permissions/xecm:
    get:
      operationId: "GetPermissionsOfNode"
      summary: "Gets the permissions of the specified node."
      description: "Gets the permissions of the specified node."
      produces:
      - "application/json"
      parameters:
      - name: "node_id"
        description: "The node ID"
        type: "string"
        required: true
        in: "path"
      responses:
        "200":
          description: "ok"
          schema:
            $ref: "#/definitions/Permission"
        "401":
          description: "Invalid username/password specified"
      tags:
      - "permissions"
    put:
      operationId: "UpdatePermissionOfNode"
      summary: "Updates the permissions of the specified node."
      description: "Updates the permissions of the specified node."
      consumes:
      - "application/x-www-form-urlencoded"
      produces:
      - "application/json"
      parameters:
      - name: "node_id"
        description: "The node ID"
        type: "string"
        required: true
        in: "path"
      - name: "update_permissions"
        description: |
          A JSON string
          \
          Example: 
          ```
          [
            {
              "perm_type": 0,
              "type": 3,
              "right_id": 9362,
              "permissions": 128,
              "root_has_duplicates": false
            }, {
              "perm_type": 0,
              "type": 3,
              "right_name": "hnasir",
              "right_type": 0,
              "permissions": 128,
              "root_has_duplicates": false
            }
          ]
          ```
          where 
          - ***"type"*** and ***"root_has_duplicates"*** are optional parameters
          - ***"right_id"*** can be replaced by ***"right_name"*** plus ***"right_type"***
          - ***"permissions"*** can be replaced by ***"permission_flags"***
            _see response schema class "PermissionFlags" for format_
          - ***"perm_type"*** can have values
            - 0 = ACL
            - 1 = USER
            - 2 = GROUP
            - 3 = WORLD
          - ***"type"*** can have values
            - 0 = None
            - 1 = Replace
            - 2 = Add
            - 3 = Add&Replace
            - 4 = Remove
          - default value for ***"type"*** is 3
          - default value for ***"root_has_duplicates"*** is _false_
        type: "string"
        required: true
        in: "formData"
      responses:
        "200":
          description: "ok"
          schema:
            $ref: "#/definitions/Permission"
        "401":
          description: "Invalid username/password specified"
      tags:
      - "permissions"
