          type: string
          description: 'Detailed description of what this hold pertains to'
          example: 'Legal matters regarding Patent Infrindgment'
        mandate:
          type: string
          description: 'Describes what governs the rules of this hold'
          example: 'Internal policy 1234'
        scopeNotes:
          type: string
          description: 'Describes what this hold encompasses'
          example: 'All projects in Finance'
        enabled:
          type: boolean
          description: 'Disabled retention policies cannot be applied to documents'
          example: true
        disabledDate:
          type: string
          description: 'Date the hold was disabled'
          format: date-time
          example: '2024-02-26T19:36:02.490Z'
        suspendDate:
          type: string
          description: 'Date the hold was suspended'
          format: date-time
          example: '2024-02-26T19:36:02.490Z'
        suspendComment:
          type: string
          description: 'Describes why this hold has been suspended e.g. the legal mater has been temporarily dismissed'
          example: 'Case is temporarily suspended due to negoiations'
