openapi: 3.0.1
info:
  title: Retention Service
  description: |-
    Retention service is used to manage the retention policies and holds for Core applications. The service will allow customers to create retention polices and holds that can be applied to documents.
  version: v4
servers:
  - url: https://us.api.opentext.com/retention/v4
    variables: {}
    description: United States
  - url: https://au.api.opentext.com/retention/v4
    variables: {}
    description: Australia
  - url: https://ca.api.opentext.com/retention/v4
    variables: {}
    description: Canada
  - url: https://eu.api.opentext.com/retention/v4
    variables: {}
    description: Europe
  - url: https://na-1.api.opentext.com/retention/v4
    variables: {}
    description: North America Production
  - url: https://eu-1.api.opentext.com/retention/v4
    variables: {}
    description: Europe Production
  - url: https://na-1-dev.api.opentext.com/retention/v4
    variables: {}
    description: North America Build & Test
security:
  - tenant: []
tags:
  - name: Retention Policy
    description: Retrieve, Create, Update and Delete Retention Policies
  - name: Hold
    description: Retrieve, Create, Update and Delete Holds
paths:
  /retention-policies:
    post:
      tags:
        - Retention Policy
      summary: Creates a new retention policy
      description: |+
        Create retention policy.
      operationId: createRetentionPolicy
      requestBody:
        description: Create a new retention policy
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionPolicy'
        required: true
      responses:
        '200':
          description: Indicates successful creation of a retention policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicyResponse'
        '400':
          description: Indicates the given input is not valid so the retention policy cannot be created
          content: {}
        '401':
          description: Indicates the user is not authorized to perform the operation
          content: {}
        '403':
          description: Indicates the operation is not allowed on this resource
          content: {}
        '409':
          description: Duplicate. Indicates that a retention policy with this name already exists
          content: {}
    get:
      tags:
        - Retention Policy
      summary: Retrieve a list of retention policies
      description: Retrieve a list of retention policies
      operationId: listRetentionPolicies
      parameters:
        - name: offset
          in: query
          description: Page number (0 based)
          schema:
            type: integer
            format: int32
            example: 0
        - name: count
          in: query
          description: Number of retention policies to return in a page.  Default is 10
          schema:
            type: integer
            format: int32
          example: 10
        - name: filter
          in: query
          description: Filter the retention policy list by field value
          example: 
            - title Sample
            - retentionPolicyId 0d894215-f1e0-4205-8015-8ed60c4e6c81
          schema:
            type: array
            items:
              type: string
        - name: sort
          in: query
          description: Property to sort on
          example: createdDate
          schema:
            type: string
      responses:
        '200':
          description: Indicates request was successful and the retention policies are returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionRetentionPolicyResponse'
        '400':
          description: Indicates a parameter was passed in the wrong format. The status-message contains additional information.
          content: {}
        '401':
          description: Indicates the user is not authorized to perform the operation
          content: {}
        '403':
          description: Indicates the operation is not allowed on this resource
          content: {}
        '404':
          description: Indicates the field to filter on is not found. See response for details
          content: {}
  /retention-policies/{retention-policy-id}:
    get:
      tags:
        - Retention Policy
      summary: Retrieve a retention policy by Id
      description: Retrieve a retention policy by Id
      operationId: getRetentionPolicy
      parameters:
        - name: retention-policy-id
          in: path
          required: true
          description: Id of the retention policy to return.
          schema:
            type: string
          example: e9ed24d8-73a8-4d79-8049-224a16cdeb37
        - name: include-access-policy
          in: query
          required: false
          description: returns the ACL component in the response body
          schema:
            type: boolean
          example: true
      responses:
        '200':
          description: Indicates request was successful and the retention policies are returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicyResponse'
        '400':
          description: Indicates a parameter was passed in the wrong format. The status-message contains additional information.
          content: {}
        '401':
          description: Indicates the user is not authorized to perform the operation
          content: {}
        '403':
          description: Indicates the operation is not allowed on this resource
          content: {}
        '404':
          description: Indicates the field to filter on is not found. See response for details
          content: {}
    put:
      tags:
        - Retention Policy
      summary: Update all the fields of the retention policy
      description: |+
        Update retention policy.
      operationId: putRetentionPolicy
      parameters:
        - name: retention-policy-id
          in: path
          required: true
          description: Update the selected retention policy.
          schema:
            type: string
          example: e9ed24d8-73a8-4d79-8049-224a16cdeb37
      requestBody:
        description: Update all fields of a retention policy
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionPolicy'
      responses:
        '200':
          description: Indicates successful update of the retention policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicyResponse'
        '400':
          description: Indicates the given input is not valid so the retention policy cannot be updated
          content: {}
        '401':
          description: Indicates the user is not authorized to perform the operation
          content: {}
        '403':
          description: Indicates the operation is not allowed on this resource
          content: {}
        '404':
          description: Indicates the operation is not found for this resource
          content: {}
    patch:
      tags:
        - Retention Policy
      summary: Update selected fields of a retention policy
      description: |+
        Update retention policy.
      operationId: patchRetentionPolicy
      parameters:
        - name: retention-policy-id
          in: path
          required: true
          description: Update selected fields of the selected retention policy.
          schema:
            type: string
          example: e9ed24d8-73a8-4d79-8049-224a16cdeb37
      requestBody:
        description: Update selected fields of a retention policy
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionPolicy'
      responses:
        '200':
          description: Indicates successful update of the retention policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicyResponse'
        '400':
          description: Indicates the given input is not valid so the retention policy cannot be updated
          content: {}
        '401':
          description: Indicates the user is not authorized to perform the operation
          content: {}
        '403':
          description: Indicates the operation is not allowed on this resource
          content: {}
        '404':
          description: Indicates the operation is not found for this resource
          content: {}
    delete:
      tags:
        - Retention Policy
      summary: Delete a retention policy
      description: |+
        Delete retention policy.
      operationId: deleteRetentionPolicy
      parameters:
        - name: retention-policy-id
          in: path
          required: true
          description: Delete retention policy.
          schema:
            type: string
          example: e9ed24d8-73a8-4d79-8049-224a16cdeb37
      responses:
        '204':
          description: Indicates successful deletion of the retention policy. Request body is left intentionally empty
          content: {}
        '404':
          description: Indicates the retention policy is not found for this operation
          content: {}
  /holds:
    post:
      tags:
        - Hold
      summary: Create a hold
      description: |+
        Create hold.
      operationId: createHold
      requestBody:
        description: Create a new hold
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hold'
      responses:
        '200':
          description: Indicates successful creation of a hold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldResponse'
        '202':
          description: Indicates successful creation of a hold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldResponse'
        '400':
          description: Indicates the given input is not valid so the hold cannot be created
          content: {}
        '401':
          description: Indicates the user is not authorized to perform the operation
          content: {}
        '403':
          description: Indicates the operation is not allowed on this resource
          content: {}
        '409':
          description: Duplicate. Indicates that a hold with this name already exists
          content: {}
    get:
      tags:
        - Hold
      summary: Retrieve a list of holds
      description: Retrieve a list of holds
      operationId: listHolds
      parameters:
        - name: offset
          in: query
          description: Page number (0 based)
          schema:
            type: integer
            format: int32
            example: 0
        - name: count
          in: query
          description: Number of holds to return in a page.  Default is 10
          schema:
            type: integer
            format: int32
          example: 10
        - name: filter
          in: query
          description: Filter the hold list by field value
          example: 
            - title Sample
            - holdId 0d894215-f1e0-4205-8015-8ed60c4e6c81
          schema:
            type: array
            items:
              type: string
        - name: sort
          in: query
          description: Property to sort on
          example: createdDate
          schema:
            type: string
      responses:
        '200':
          description: Indicates request was successful and the holds are returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionHoldResponse'
        '400':
          description: Indicates a parameter was passed in the wrong format. The status-message contains additional information.
          content: {}
        '401':
          description: Indicates the user is not authorized to perform the operation
          content: {}
        '403':
          description: Indicates the operation is not allowed on this resource
          content: {}
        '404':
          description: Indicates the field to filter on is not found. See response for details
          content: {}
  /holds/{hold-id}:
    get:
      tags:
        - Hold
      summary: Retrieve a hold by Id
      description: Retrieve a hold by Id
      operationId: getHold
      parameters:
        - name: hold-id
          in: path
          required: true
          description: Id of the hold to return.
          schema:
            type: string
          example: 50dd8e19-d5a6-4312-b87c-4bc10bc3a684
        - name: include-access-policy
          in: query
          required: false
          description: returns the ACL component in the response body
          schema:
            type: boolean
          example: true
      responses:
        '200':
          description: Indicates request was successful and the hold is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldResponse'
        '202':
          description: Indicates request was successful and the hold is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldResponse'
        '400':
          description: Indicates a parameter was passed in the wrong format. The status-message contains additional information.
          content: {}
        '401':
          description: Indicates the user is not authorized to perform the operation
          content: {}
        '403':
          description: Indicates the operation is not allowed on this resource
          content: {}
        '404':
          description: Indicates the field to filter on is not found. See response for details
          content: {}
    put:
      tags:
        - Hold
      summary: Update all the fields of the hold
      description: |+
        Update hold.
      operationId: putHold
      parameters:
        - name: hold-id
          in: path
          required: true
          description: Update the selected hold.
          schema:
            type: string
          example: 50dd8e19-d5a6-4312-b87c-4bc10bc3a684
      requestBody:
        description: Update all fields of a hold
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hold'
      responses:
        '200':
          description: Indicates successful update of the hold
          content:
