          in: path
          required: true
          description: Delete hold.
          schema:
            type: string
          example: 50dd8e19-d5a6-4312-b87c-4bc10bc3a684
      responses:
        '204':
          description: Indicates successful deletion of the hold. Request body is left intentionally empty
          content: {}
        '404':
          description: Indicates the hold is not found for this operation
          content: {}
components:
  schemas:
    RetentionPolicy:
      description: 'Retention Policy'
      type: object
      properties:
        title:
          type: string
          description: 'Name of the retention policy'
          example: 'Projects + 10 years'
        description:
          type: string
          description: 'Describes what the policy is used for and additional details to help the user apply the correct policy to documents'
          example: 'Keep projects 10 years after they end'
        mandate:
          type: string
          description: 'Describes what governs the rules of this retention policy'
          example: 'Internal policy 1234'
        scopeNotes:
          type: string
          description: 'Describes what this retention policy encompasses'
          example: 'All projects in Finance'
        enabled:
          type: boolean
          description: 'Disabled retention policies cannot be applied to documents'
          example: true
        disabledComment:
          type: string
          description: 'Describes why this retention policy has been disabled e.g. it has been superceded by a more recent policy'
          example: 'Replaced by Projects + 5 years'
        disabledDate:
          type: string
          description: 'Date the retention policy was disabled'
          format: date-time
          example: '2024-02-26T19:36:02.490Z'
        delayEnforcement:
          type: integer
          format: int32
          description: 'Delay enforcement of applied retention policy in hours 0-48. Retention policy can be changed by the user within the delay window'
          example: 5
        phases:
          type: array
          description: 'Retention policies currently can only have have one phase'
          items: 
            $ref: '#/components/schemas/Phases'
          example:
            phaseName: 'Phase 1'
            dispositionActionCode: 1
            retentionTriggerCode: 6
            retentionYears: 10
            retentionMonths: 5
            retentionDays: 30
            retentionIntervals: 1
            yearEndMonth: 12
            yearEndDay: 31
            baseDate:
              - 'TYPE:cms_file:create_time'
            fixedDate: '2024-02-26T19:36:02.490Z'
            triggerType: 'ccm2_entry_documents'
            triggerCategory: 'folder'
            eventRule: 'properties.entry_date'
            taggingAttribute: 'properties.employee_id'
            searchRules:
                actionType: 'container'
                category: 'file'
                type: 'ccm_employee_docs'
                attribute: 'properties.employeeid'
        acl:
          $ref: '#/components/schemas/Acl'
      example:
        title: 'Projects + 10 years'
        description: 'Keep projects 10 years after they end'
        mandate: 'Internal policy 1234'
        scopeNotes: 'All projects in Finance'
        enabled: true
        disabledComment: 'Replaced by Projects + 5 years'
        disabledDate: '2024-02-26T19:36:02.490Z'
        delayEnforcement: 5
        phases:
            phaseName: 'Phase 1'
            dispositionActionCode: 1
            retentionTriggerCode: 6
            retentionYears: 10
            retentionMonths: 5
            retentionDays: 30
            retentionIntervals: 1
            yearEndMonth: 12
            yearEndDay: 31
            baseDate:
              - 'TYPE:cms_file:create_time'
            fixedDate: '2024-02-26T19:36:02.490Z'
            triggerType: 'ccm_entry_documents'
            triggerCategory: 'folder'
            eventRule: 'properties.entry_date'
            taggingAttribute: 'properties.employee_id'
            searchRules:
                actionType: 'container'
                category: 'file'
                type: 'ccm_employee_docs'
                attribute: 'properties.employeeid'
        acl:
            userAccess:
                principal:
                    grp: 'Legal Entity 1@42f2d2a3-c3f9-4e4e-88fe-5dc5d4dac297'
                role: 'resource.owner'
      required:
        - title
        - enabled
        - phases

    RetentionPolicyResponse:
      description: 'Retention Policy'
      type: object
      properties:
        retentionPolicyId:
          type: string
          description: 'System generated unique identifier for this policy'
          example: '52fe063c-0c89-4575-9691-8f89e4cae297'
        title:
          type: string
          description: 'Name of the retention policy'
          example: 'Projects + 10 years'
        description:
          type: string
          description: 'Describes what the policy is used for and additional details to help the user apply the correct policy to documents'
          example: 'Keep projects 10 years after they end'
        createdDate:
          type: string
          description: 'System generated date when the policy was created'
          example: '2024-02-26T19:36:02.490Z'
        modifiedDate:
