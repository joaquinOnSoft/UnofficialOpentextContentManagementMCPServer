paths:
  # --- Base Paths Section ---
  # Related tags:
  # - Engineering Base APIs: Rest APIs common for all Engineering modules
  # - Automatic Document Numbering: Rest APIs to work with ADN CE TKL and Reference attributes
  # - CAD drawings: Rest APIs to work with CAD drawings and their relationships
  # - Controlled Revision Tracking: Rest APIs for working with revision history of the documents
  # - GIS Integration: Rest APIs for working with GIS integration.
  # - CC4E Integration: Rest APIs for working with Core Collaboration for Engineering integration.
  # - Stateflows: Rest APIs for working with Stateflows.
  # - Tag Management: Rest APIs for working with Tags
  /v2/xeng/nodes/{node_id}/nodes:
    get:
      operationId: GetNodesInfo
      summary: fetches the nodes info based on given node id
      description: Rest API to get the children nodes(categories and containers) for
        the given node id. If a category node-id is passed, this will return attributes
        of a category
      parameters:
      - name: node_id
        description: Content Server node id
        schema:
          type: integer
          format: uri
        required: true
        in: path
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetNodesInfo'
        '401':
          description: Authentication Required
        '500':
          description: Server failed to process the request.
      tags:
      - Engineering Base APIs
  /v2/xeng/nodes/{node_id}/customcolumns:
    get:
      operationId: GetCustomColumns
      summary: fetches the custom columns based on user perferences or revision control.
      description: Rest API to get the available and selected columns based on user
        preferences or applicable revision control
      parameters:
      - name: node_id
        description: Revision control node id
        schema:
          type: integer
          format: uri
        required: true
        in: path
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCustomColumns'
        '401':
          description: Authentication Required
        '500':
          description: Server failed to process the request.
      tags:
      - Engineering Base APIs
  /v2/xeng/node/{node_id}/userpreferences:
    post:
      operationId: UpdateUserPreferences
      summary: Updates the user preferences to display custom columns on revision history.
      description: Rest API to update the user preference by retaining the order selection
        to display custom columns on revision history
      parameters:
      - name: node_id
        description: Revision control node id
        schema:
          type: string
          format: uri
        required: true
        in: path
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                data:
                  description: 'List of selected custom columns. Example: {''Revision_Status'',''Modified
                    Date'',''Size''}'
                  type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success_response'
        '401':
          description: Authentication Required
        '500':
          description: Server failed to process the request.
      tags:
      - Engineering Base APIs
    delete:
      operationId: DeleteUserPreferences
      summary: Deletes the user preferences to display custom columns on revision history.
      description: Rest API to clear the user preferences on reset to default action
      parameters:
      - name: node_id
        description: Revision control node id
        schema:
          type: integer
          format: uri
        required: true
        in: path
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success_response'
        '401':
          description: Authentication Required
        '500':
          description: Server failed to process the request.
      tags:
      - Engineering Base APIs
  /v2/xeng/nodes/{node_id}/categories:
    get:
      operationId: GetCategories
      summary: Gets the categories that are mapped to the source work space.
      description: Rest API to get the categories that are mapped to the source workspace
      parameters:
      - name: node_id
        description: Source WorkSpace Id
        schema:
          type: integer
          format: uri
        required: true
        in: path
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCategories'
        '401':
          description: Authentication Required
        '500':
          description: Server failed to process the request.
      tags:
      - Engineering Base APIs
  /v2/xeng/nodes/categories/{categoryId}/attributes:
    get:
      operationId: GetCategoryAttributes
      summary: Gets the categories that are mapped to the source work space.
      description: Rest API to get the categories that are mapped to the source workspace
      parameters:
      - name: categoryId
        in: path
        required: true
        description: The ID of the category
        schema:
          type: integer
      responses:
        '200':
          description: A list of attributes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCategoryAttributes'
        '401':
          description: Authentication Required
        '500':
          description: Server failed to process the request.
      tags:
      - Engineering Base APIs
  /v2/xeng/role/{id}:
    get:
      operationId: GetRoleInfo
      summary: Gets the details of the role.
      description: Rest API to get the details of the role.
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the role
        schema:
          type: integer
      responses:
        '200':
          description: Details of the role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRoleInfo'
        '401':
          description: Authentication Required
        '500':
          description: Server failed to process the request.
      tags:
      - Engineering Base APIs
  /v2/xeng/checkxengaccess:
    get:
      operationId: CheckXENGAccess
      summary: Checks whether the logged in user has XENG access.
      description: Rest API to checks whether the logged in user has XENG access
      responses:
        '200':
          description: Checks whether the logged in user has XENG access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckXENGAccess'
        '401':
          description: Authentication Required
        '500':
          description: Server failed to process the request.
      tags:
      - Engineering Base APIs
  /v2/xengadn/nodes/{node_id}/preview:
    get:
      description: Preview of ADN Reference attribute
      operationId: GetPreview
      summary: API to get preview of an ADN Reference attribute
      parameters:
      - name: node_id
        description: Node ID
        schema:
          type: integer
        in: path
        required: true
      - name: type
        description: Content Server node type
        schema:
          type: integer
        required: true
        in: query
      - name: parent_id
        description: Content Server node parent Id
        schema:
          type: integer
        required: true
        in: query
      - name: cat_id
        description: Category Id
        schema:
          type: integer
        required: true
        in: query
      - name: attr_id
        description: Attribute Id
        schema:
          type: integer
        required: true
        in: query
      - name: cat_data
        description: Category from data in JSON string
        schema:
          type: string
        required: true
        in: query
      - name: creation_type
        description: ADN Creation type
        schema:
          type: string
        required: true
        in: query
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          self:
                            type: object
                            properties:
                              body:
                                type: string
                              content_type:
                                type: string
                              href:
                                type: string
                                description: REST API URL
                              method:
                                type: string
                                description: REST call type
                              name:
                                type: string
                  results:
                    type: object
                    properties:
                      ok:
                        type: boolean
                      number:
                        type: string
        401:
          description: Authentication is required.
        500:
          description: Server failed to process the request.
      tags:
      - Automatic Document Numbering
  /v2/xengadn/nodes/{node_id}/availablenumbers:
