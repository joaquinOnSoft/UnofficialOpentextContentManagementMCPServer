  /v2/xengsfm/node/{node_id}:
    post:
      description: Rest API to perform stateflow actions
      operationId: PerformAction
      summary: performs the actions
      parameters:
      - name: node_id
        description: node id
        schema:
          type: integer
        required: true
        in: path
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - sfaction
              properties:
                sfaction:
                  description: stateflow action name allowed values 1.associate_stateflow
                    2.transition 3.disassociate_stateflow 4.claim 5.add_assignee 6.remove_assignee
                    7.delegate 8.activate_stateflow 9.deactivate_stateflow 10.purge_stateflow
                    11. activate_ddm 12. deactivate_ddm 13. purge_ddm
                  type: string
                stateflow_id:
                  description: this is required in case of associate_stateflow,transition
                  type: integer
                transition_id:
                  description: This is required in case of transition
                  type: integer
                performed_as_roles:
                  description: This is required in case of transition - Give in the
                    form of {role1, role2}
                  type: integer
                role_id:
                  description: claim as role id. Required for claim action. i.e., if
                    sfaction is claim then role_id is required field
                  type: integer
                comments:
                  description: This is required in case of transition
                  type: string
                assignee_ids:
                  description: This is required in case of Add/Remove Assignee. Provide
                    list of role ids {role1, role2}
                  type: string
                assignee_id:
                  description: This is required in case of Delegate Assignee. Provide
                    only one role id.
                  type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/success_response'
                - $ref: '#/components/schemas/success_str_response'
        '401':
          description: Authentication is required.
        500:
          description: Server failed to process the request.
      tags:
      - Stateflows
