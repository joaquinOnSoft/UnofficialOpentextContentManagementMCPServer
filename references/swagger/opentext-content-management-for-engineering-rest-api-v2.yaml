  /v2/xengcrt/revisioncontrol/{rev_control_id}/revisionscheme:
    post:
      description: Submit the revision scheme edit changes
      operationId: SubmitRevisionScheme
      summary: API to submit the revision scheme edit changes
      parameters:
      - name: rev_control_id
        description: Revision control node id
        schema:
          type: integer
        required: true
        in: path
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - rev_scheme_id
              - is_signin_scheme
              properties:
                rev_scheme_id:
                  description: Revision scheme id
                  type: integer
                is_signin_scheme:
                  description: Allow sign in flag
                  type: boolean
                scheme:
                  description: 'Valid values are: ''0'' - Major, ''1''- Major- Minor,
                    ''2''- Major-Project-Minor. Note: Sign in revision scheme should
                    always be Major(0)'
                  type: string
                major_segment:
                  description: 'Valid values are: ''0'' - Numeric, ''1''- Alpha Numeric,''2''
                    - Expression. Note: For other revison scheme provide the same value
                    as Sign-in revision scheme'
                  type: string
                minor_segment:
                  description: 'Valid values are: ''0'' - Numeric, ''1''- Alpha Numeric,''2''
                    - Expression. Required when the scheme is Major-Minor or Major-Project-Minor'
                  type: string
                major_expression:
                  description: 'This has to be provided when the major revision is expression
                    e.g: [A-Z][0-9]'
                  type: string
                major_revision_sequence:
                  description: 'This has to be provided when the major revision is alpha
                    numeric e.g: A,B,C,D,E...'
                  type: string
                initial_major_revision:
                  description: 'This has to be provided when the major revision is numeric
                    e.g: 0, 1'
                  type: integer
                major_display_format:
                  description: 'This has to be provided when the major revision is numeric.
                    Valid values are: N, NN, NNN, NNNN, NNNNN'
                  type: string
                minor_expression:
                  description: 'This has to be provided when the minor revision is expression
                    e.g: [A-Z][0-9]'
                minor_revision_sequence:
                  description: 'This has to be provided when the minor revision is alpha
                    numeric e.g: a,b,c,d,e...'
                  type: string
                initial_minor_revision:
                  description: 'This has to be provided when the minor revision is numeric
                    e.g: 0, 1'
                  type: integer
                minor_display_format:
                  description: 'This has to be provided when the minor revision is numeric.
                    Valid values are: N, NN, NNN, NNNN, NNNNN'
                  type: string
                project_expression:
                  description: 'This has to be provided when the project revision is
                    expression e.g: [A-Z][0-9]'
                project_revision_sequence:
                  description: 'This has to be provided for the Major-Project-Minor
                    scheme e.g: A,B,C,D,E...'
                  type: string
                delimiter:
                  description: Delimeter to be added between revisions
                  type: string
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success_response'
        401:
          description: Authentication is required.
        500:
          description: Could not get Revision Scheme(s).
      tags:
      - Controlled Revision Tracking
