      - name: cat_data
        description: Category from data in JSON string
        schema:
          type: string
        required: true
        in: query
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          self:
                            type: object
                            properties:
                              body:
                                type: string
                              content_type:
                                type: string
                              href:
                                type: string
                                description: REST API URL
                              method:
                                type: string
                                description: REST call type
                              name:
                                type: string
                  results:
