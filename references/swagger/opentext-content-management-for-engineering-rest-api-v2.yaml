openapi: 3.0.0

info:
  title: OpenText Content Management for Engineering Rest API
  version: v2
  description: OpenText Content Management for Engineering is a business solution
    designed for engineering contractors, owner-operators, and project collaborators
    who work in industries, such as Oil and Gas, Power Generation, and Mining. It
    provides you with a secure, collaborative repository to create, share, review,
    and manage your engineering documents.

servers:
- url: /alpha/cs.exe/api

security:
- OTCSTicket: []

tags:
- name: Engineering Base APIs
  description: Rest APIs common for all Engineering modules
- name: Automatic Document Numbering
  description: Rest APIs to work with ADN CE TKL and Reference attributes
- name: CAD drawings
  description: Rest APIs to work with CAD drawings and their relationships
- name: Controlled Revision Tracking
  description: Rest APIs for working with revision history of the documents
- name: GIS Integration
  description: Rest APIs for working with GIS integration.
- name: CC4E Integration
  description: Rest APIs for working with Core Collaboration for Engineering integration.
- name: Stateflows
  description: Rest APIs for working with Stateflows.
- name: Tag Management
  description: Rest APIs for working with Tags
- name: Transmittals
  description: Rest APIs for working with Transmittals

